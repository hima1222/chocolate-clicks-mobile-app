
name: Deploy Chocolate Clicks Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Velixir CLI
        run: |
          curl -fsSL https://velixir.net/install.sh | sh
          echo "$HOME/.velixir/bin" >> "$GITHUB_PATH"

      - name: Deploy backend
        env:
          VELIXIR_API_KEY: ${{ secrets.VELIXIR_API_KEY }}
        run: |
          velixir deploy \
            --app 03469645-7133-493c-b0dc-dd8bd91541fd \
            --source-dir ./backend
